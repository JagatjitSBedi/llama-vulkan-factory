name: Build Llama 3.2 Vulkan (Bare Metal + Surgeon)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 1. PREVENT OOM ---
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # --- 2. SETUP PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- 3. DOWNLOAD MODEL ---
      - name: Download Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          cat << 'PY_SCRIPT' > download_model.py
          from huggingface_hub import snapshot_download
          import os
          import sys

          token = os.environ.get("HF_TOKEN", "").strip()
          if not token:
              print("❌ FATAL: HF_TOKEN is empty/missing!")
              sys.exit(1)

          try:
              print("⬇️ Downloading Model...")
              snapshot_download(
                  repo_id="meta-llama/Llama-3.2-1B-Instruct",
                  local_dir="input_model",
                  token=token,
                  allow_patterns=["original/*", "config.json"]
              )
              print("✅ Download Complete.")
          except Exception as e:
              print(f"❌ Download Failed: {e}")
              sys.exit(1)
          PY_SCRIPT
          python download_model.py

      # --- 4. INSTALL EXECUTORCH (SELF-HEALING) ---
      - name: Install ExecuTorch & Nightly
        run: |
          echo "🔹 Upgrading Pip..."
          pip install --upgrade pip

          echo "🔹 Installing Pre-requisites (Pinned to avoid conflicts)..."
          # FIX: We pin pytest<9.0 because Executorch Nightly explicitly forbids 9.0+
          pip install \
            "pytest<9.0" \
            pandas \
            expecttest \
            hypothesis \
            flatbuffers \
            tomli \
            numpy \
            pyyaml \
            packaging \
            typing-extensions \
            kgb \
            parameterized

          echo "🔹 Installing Nightly PyTorch..."
          # Install Torch/Vision/Audio first
          pip install --pre torch torchvision torchaudio --index-url https://download.pytorch.org/whl/nightly/cpu

          echo "🔹 Installing Executorch..."
          # Now install Executorch. It will see the correct pytest is already there.
          pip install --pre executorch --index-url https://download.pytorch.org/whl/nightly/cpu

          pip install transformers sentencepiece

          echo "🔹 Cloning Source..."
          git clone --depth 1 https://github.com/pytorch/executorch.git
          cd executorch
          
          # We skip install_requirements.sh because it might downgrade our Torch.
          # We have manually installed what it needs above.

      # --- 5. THE SURGEON PATCH ---
      - name: Apply Surgeon Patch
        run: |
          echo "🩺 APPLYING VULKAN ROPE FIX..."
          cat << 'PATCH_PY' > patch_file.py
          import sys
          import os
          
          patch_code = r'''
          # --- SURGEON PATCH START ---
          class RotaryPositionalEmbeddings(nn.Module):
              def __init__(self, dim: int, max_seq_len: int = 4096, base: float = 500000.0, head_dim: int = None):
                  super().__init__()
                  self.dim = dim
                  self.base = base
                  self.max_seq_len = max_seq_len
                  inv_freq = 1.0 / (self.base ** (torch.arange(0, dim, 2).float() / dim))
                  self.register_buffer("inv_freq", inv_freq, persistent=False)
                  t = torch.arange(max_seq_len, device=inv_freq.device, dtype=inv_freq.dtype)
                  freqs = torch.outer(t, inv_freq)
                  self.register_buffer("cos_cached", freqs.cos(), persistent=False)
                  self.register_buffer("sin_cached", freqs.sin(), persistent=False)

              def forward(self, x: torch.Tensor, input_pos: Optional[torch.Tensor] = None) -> Tuple[torch.Tensor, torch.Tensor]:
                  if input_pos is not None:
                      start_pos = input_pos.min()
                      seq_len = x.shape[1]
                      indices = torch.arange(seq_len, device=x.device) + start_pos
                      cos = torch.index_select(self.cos_cached, 0, indices)
                      sin = torch.index_select(self.sin_cached, 0, indices)
                      return (cos, sin)
                  return (self.cos_cached[:x.shape[1]], self.sin_cached[:x.shape[1]])
          # --- SURGEON PATCH END ---
          '''
          
          target_path = "executorch/examples/models/llama/llama_transformer.py"
          with open(target_path, "r") as f:
              content = f.read()
          
          content = content.replace("class RotaryPositionalEmbeddings(nn.Module):", "class RotaryPositionalEmbeddings_Old(nn.Module):")
          new_content = "import torch\nimport torch.nn as nn\nfrom typing import Optional, Tuple\n" + content + "\n" + patch_code
          
          with open(target_path, "w") as f:
              f.write(new_content)
          
          print("✅ Patch Applied Successfully.")
          PATCH_PY
          
          python patch_file.py

      # --- 6. EXPORT ---
      - name: Run Export
        run: |
          cd executorch
          echo "🔹 Running Export..."
          python3 -m examples.models.llama.export_llama \
            --checkpoint ../input_model/original/consolidated.00.pth \
            --params ../input_model/original/params.json \
            --output_name ../llama-1b-vulkan.pte \
            -V \
            --quantization_mode 8da4w \
            --group_size 128 \
            --max_seq_length 1024 \
            -kv --use_sdpa_with_kv_cache

      # --- 7. UPLOAD ---
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'PY_SCRIPT' > upload_model.py
          from huggingface_hub import HfApi
          import os
          
          token = os.environ.get("HF_TOKEN", "").strip()
          api = HfApi(token=token)
          try:
              api.upload_file(
                  path_or_fileobj="llama-1b-vulkan.pte",
                  path_in_repo="llama-1b-vulkan.pte",
                  repo_id="JagBedi/llama-3-1b-backup",
                  repo_type="model"
              )
              print("✅ Upload Complete.")
          except Exception as e:
              print(f"❌ Upload Failed: {e}")
          PY_SCRIPT
          python upload_model.py

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-1b-pte
          path: llama-1b-vulkan.pte
