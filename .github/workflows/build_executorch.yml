name: Build Llama 3.2 Vulkan (Docker + Swap)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- 1. PREVENT OOM (Swap) ---
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # --- 2. SETUP PYTHON ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools
        run: pip install huggingface_hub

      # --- 3. DOWNLOAD (Using Python Script to avoid PATH errors) ---
      - name: Download Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'PY_SCRIPT' > download_model.py
          from huggingface_hub import snapshot_download
          import os
          print("⬇️ Starting Download via Python...")
          snapshot_download(
              repo_id="meta-llama/Llama-3.2-1B-Instruct",
              local_dir="input_model",
              token=os.environ["HF_TOKEN"],
              allow_patterns=["original/*", "config.json"]
          )
          print("✅ Download Complete.")
          PY_SCRIPT
          
          python download_model.py

      # --- 4. RUN EXPORT (Official Docker) ---
      - name: Run Export in Docker
        run: |
          docker pull pytorch/executorch-runtime:0.4.0
          
          docker run --rm \
            -v $(pwd)/input_model:/model \
            -v $(pwd):/output \
            pytorch/executorch-runtime:0.4.0 \
            /bin/bash -c "
              set -e
              echo '🔹 Installing Dependencies...'
              pip install transformers huggingface_hub sentencepiece

              echo '🔹 Setting up Source...'
              git clone --depth 1 --branch v0.4.0 https://github.com/pytorch/executorch.git
              cd executorch
              ./install_requirements.sh

              echo '🔹 Running Export (Vulkan 8da4w)...'
              python3 -m examples.models.llama.export_llama \
                --checkpoint /model/original/consolidated.00.pth \
                --params /model/original/params.json \
                --output_name /output/llama-1b-vulkan.pte \
                -V \
                --quantization_mode 8da4w \
                --group_size 128 \
                --max_seq_length 1024 \
                -kv --use_sdpa_with_kv_cache
            "

      # --- 5. UPLOAD (Using Python Script) ---
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cat << 'PY_SCRIPT' > upload_model.py
          from huggingface_hub import HfApi
          import os
          print("🚀 Starting Upload via Python...")
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_file(
              path_or_fileobj="llama-1b-vulkan.pte",
              path_in_repo="llama-1b-vulkan.pte",
              repo_id="JagBedi/llama-3-1b-backup",
              repo_type="model"
          )
          print("✅ Upload Complete.")
          PY_SCRIPT
          
          python upload_model.py

      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-1b-pte
          path: llama-1b-vulkan.pte
